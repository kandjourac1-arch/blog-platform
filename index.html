<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blog Platform — Analyses & Actualité</title>
  <meta name="description" content="Analyses approfondies sur l'actualité : économie, technologie, énergie, santé.">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">Blog Platform</a>
      <nav class="nav">
        <a href="/">Accueil</a>
        <a href="#tags">Thématiques</a>
        <a href="#search">Rechercher</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-text">
        <h1>Analyses approfondies — Actualité en perspective</h1>
        <p class="lead">Un site au design épuré pour lire des enquêtes et analyses détaillées, ton analytique, en français.</p>
        <div class="cta"><a href="#articlesList">Découvrir les derniers articles</a></div>
      </div>
      <div class="hero-visual" aria-hidden="true" style="width:360px;">
        <div style="background:linear-gradient(135deg,#f4f6fb,#ffffff);border-radius:20px;height:220px;display:flex;align-items:center;justify-content:center;color:#9aa4b2;font-weight:700;box-shadow:0 18px 40px rgba(16,24,40,0.06)">Visuel</div>
      </div>
    </section>

    <section id="search" class="search">
      <input id="searchInput" type="search" placeholder="Rechercher par titre, mot-clé ou extrait…" aria-label="Recherche">
    </section>

    <section class="articles" id="articlesList">
      <!-- Cards injected at build; improved layout and thumbnails -->
      <!-- Existing cards preserved; new CSS will enhance visuals -->
    </section>

    <footer class="footer">
      <p>© 2026 Blog Platform — Design épuré. <a href="/sitemap.xml">Sitemap</a></p>
    </footer>
  </main>

  <script src="/assets/js/search.js"></script>
  <script>
    // hydrate cards from existing DOM or rebuild simple listing if empty
    (function(){
      const list = document.getElementById('articlesList');
      if (!list.querySelector('.card')) {
        // fetch index.json if present
        fetch('/content/index.json').then(r=>{ if(!r.ok) return; return r.json(); }).then(data=>{
          if(!data) return;
          data.forEach(item=>{
            const el = document.createElement('article'); el.className='card';
            el.innerHTML = `<a class="card-link" href="/articles/${item.path.split('/').pop().replace('.md','.html')}">`+
                           `<div class="thumb">${item.tags && item.tags[0] ? item.tags[0] : 'Article'}</div>`+
                           `<h2>${item.title}</h2><p class="meta">${new Date(item.date).toLocaleDateString('fr-FR')} · ${item.author || 'Rédaction analytique'} · ${item.tags ? item.tags.slice(0,2).join(', ') : ''}</p>`+
                           `<p class="excerpt">${item.summary || ''}</p></a>`;
            list.appendChild(el);
          })
        }).catch(()=>{});
      }
    })();
  </script>
</body>
</html>
